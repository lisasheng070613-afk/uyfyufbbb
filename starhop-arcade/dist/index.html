<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#120e21">
  <meta name="description" content="八关横版像素冒险，七关跑酷与一场弹幕对决。">
  <title>星跃冒险 · STARHOP ARCADE</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./worlds.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M10 2h4v5h3v3h5v4h-5v3h-3v5h-4v-5H7v-3H2v-4h5V7h3z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0 6 6m0-6-6 6"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h2v2h4v2h4v2h3v4h-3v2h-4v2H9v2H7z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 3v7m-5 0h10"/></symbol>
    <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7 7h10a4 4 0 0 1 4 3l1 5c.5 2.5-2 4-3.5 2.5L16 15H8l-2.5 2.5C4 19 1.5 17.5 2 15l1-5a4 4 0 0 1 4-3Zm0 2v4m-2-2h4m7-1h.01m3 2h.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h6v2h2v2h2V6h2V4h6v2h2v8h-2v2h-2v2h-2v2h-2v2h-6v-2H7v-2H5v-2H3v-2H1V6h2z"/></symbol>
  </svg>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><div class="brand-mark"><svg><use href="#i-star"/></svg></div><div><strong>星跃冒险</strong><span>STARHOP ARCADE</span></div></div>
      <div class="top-tools">
        <button id="sound" class="tool" type="button" aria-label="静音" title="静音"><svg><use href="#i-volume"/></svg></button>
        <button id="fullscreen" class="tool" type="button" aria-label="全屏" title="全屏"><svg><use href="#i-full"/></svg></button>
      </div>
    </div>
  </header>
  <main class="layout">
    <div class="main-column">
      <section class="cabinet" id="cabinet" aria-label="星跃冒险游戏">
        <header class="screen-bar">
          <div class="zone-label"><i></i><span id="zone">01</span><span class="bar-divider"></span><strong id="worldName">暮光草原</strong></div>
          <div class="screen-tools"><span class="screen-state" id="status">待机</span><button class="tool pause" id="pause" type="button" aria-label="暂停" title="暂停 (Esc)" hidden><svg><use href="#i-pause"/></svg></button></div>
        </header>
        <div class="screen" id="screen">
          <canvas id="game" width="768" height="480" tabindex="0" aria-label="游戏画面。A 左移，D 右移，空格跳跃，鼠标左键攻击。"></canvas>
          <div class="hud" id="hud" hidden>
            <div class="hearts" id="hearts"></div>
            <div class="hud-chip"><svg><use href="#i-star"/></svg><span id="stars">00</span></div>
          </div>
          <div class="boss-hud" id="bossHud" hidden><div><strong>星铃守卫</strong><span id="bossPhase"></span></div><div class="boss-track"><i id="bossFill"></i></div></div>
          <div class="toast" role="status" id="toast" hidden></div>
          <div class="overlay title-overlay" id="overlay">
            <div class="overlay-content">
              <div class="title-eyebrow" id="eyebrow"><svg><use href="#i-star"/></svg><span>STARHOP ARCADE</span></div>
              <h1 id="overlayTitle">星跃<span>冒险</span></h1>
              <p id="overlayText">穿越七片星野，迎战最后的弹幕守卫。</p>
              <div class="actions"><button id="primary" class="primary" type="button"><svg><use id="primaryIcon" href="#i-play"/></svg><span id="primaryText">开始冒险</span></button><button id="secondary" class="secondary" type="button" hidden>返回标题</button></div>
            </div>
          </div>
        </div>
        <div class="touch" id="touch" hidden>
          <div><button data-key="KeyA" aria-label="左移">◀</button><button data-key="KeyD" aria-label="右移">▶</button></div>
          <div><button data-key="Space">跳跃</button><button data-key="Attack">攻击</button></div>
        </div>
        <footer class="screen-footer"><span><svg><use href="#i-star"/></svg> 收集星砂，抵达星门</span><span id="stageTag">横版冒险 <i></i> 08 关卡</span></footer>
      </section>
      <section class="controls" aria-labelledby="controlsTitle">
        <div class="control-title"><div class="control-icon"><svg><use href="#i-pad"/></svg></div><h2 id="controlsTitle">操作指南</h2></div>
        <div class="control-items">
          <div><span class="keys"><kbd>A</kbd><kbd>D</kbd></span><span>左右移动</span></div>
          <div><span class="keys"><kbd class="space">SPACE</kbd></span><span>跳跃</span></div>
          <div><span class="keys"><kbd class="mouse"><svg><use href="#i-mouse"/></svg><span>左键</span></kbd></span><span>攻击</span></div>
        </div>
      </section>
    </div>
    <aside class="worlds" aria-labelledby="worldsTitle">
      <div class="worlds-head"><div class="world-icon"><svg><use href="#i-star"/></svg></div><div><h2 id="worldsTitle">关卡地图</h2><div class="small-label">WORLD SELECT</div></div></div>
      <div class="progress"><span>冒险进度</span><strong id="progressText">0 / 8</strong><div class="progress-track"><i id="progressFill"></i></div></div>
      <ol id="levelList"></ol>
    </aside>
  </main>
  <footer class="page-footer"><svg><use href="#i-star"/></svg> STARHOP ARCADE</footer>
</body>
</html>
